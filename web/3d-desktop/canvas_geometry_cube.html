<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js canvas - geometry - cube</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				font-family: Monospace;
				background-color: #f0f0f0;
				margin: 0px;
				overflow: hidden;
			}
		</style>
	</head>
	<body>

		<script type="text/javascript" src="js/three.js"></script>
		<script type="text/javascript" src="js/TrackballControls.js"></script>
		<script src="js/Detector.js"></script>
		
		
		<script>
			if ( ! Detector.webgl ) Detector.addGetWebGLMessage();
			
			var container;
			var controls; 
			var camera, scene, renderer;

			var cube, plane;
			
			init();
			animate();

			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				var info = document.createElement( 'div' );
				info.style.position = 'absolute';
				info.style.top = '10px';
				info.style.width = '100%';
				info.style.textAlign = 'center';
				info.innerHTML = 'Drag to spin the cube';
				container.appendChild( info );

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.y = 150;
				camera.position.z = 500;
				
				controls = new THREE.TrackballControls( camera );

				controls.rotateSpeed = 2.0;
				controls.zoomSpeed = 1.2;
				controls.panSpeed = 0.8;

				controls.noZoom = false;
				controls.noPan = false;

				controls.staticMoving = true;
				controls.dynamicDampingFactor = 0.3;

				controls.keys = [ 65, 83, 68 ];

				controls.addEventListener( 'change', render );
				
				
				scene = new THREE.Scene();

				// Cube
				var textureLoader = new THREE.TextureLoader();
				var texture = textureLoader.load('js/textures/paper.jpg');
				var material = [
					new THREE.MeshBasicMaterial( {map: texture }), // правая сторона
					new THREE.MeshBasicMaterial( {map: texture }), // левая сторона
					new THREE.MeshBasicMaterial( { color: 0xffffff }), //верх
					new THREE.MeshBasicMaterial( { color: 0xffffff }), // низ
					new THREE.MeshBasicMaterial( {map: texture }), // лицевая сторона
					new THREE.MeshBasicMaterial( {map: texture }) // задняя сторона
				];
				var geometry = new THREE.BoxGeometry( 200, 200, 200, material );

				

				

				//var material = new THREE.MeshBasicMaterial({  map : texture });
				cube = new THREE.Mesh( geometry, new THREE.MeshFaceMaterial(material) );
				cube.position.y = 150;
				scene.add( cube );

				// Plane

				var geometry = new THREE.PlaneBufferGeometry( 200, 200 );
				geometry.rotateX( - Math.PI / 2 );

				var material = new THREE.MeshBasicMaterial( { color: 0xe0e0e0, overdraw: 0.5 } );

				plane = new THREE.Mesh( geometry, material );
				scene.add( plane );

				renderer = new THREE.WebGLRenderer();
				renderer.setClearColor( 0xf0f0f0 );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				container.appendChild( renderer.domElement );




				//

				window.addEventListener( 'resize', onWindowResize, false );

			}

			function onWindowResize() {

				windowHalfX = window.innerWidth / 2;
				windowHalfY = window.innerHeight / 2;

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}


			function animate() {

				requestAnimationFrame( animate );
				controls.update();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
